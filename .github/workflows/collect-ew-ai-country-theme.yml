name: collect-ew-ai-country-theme

on:
  push:
    branches:
      - ew-ai-country-theme-20260901
    paths:
      - scripts/collect_openalex_raw.py
      - .github/workflows/collect-ew-ai-country-theme.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Collect OpenAlex records
        env:
          OPENALEX_EMAIL: masakikatoh@yahoo.ca
        run: python scripts/collect_openalex_raw.py output
      - name: Upload dataset
        uses: actions/upload-artifact@v4
        with:
          name: ew-ai-country-theme-openalex-raw
          path: output
          retention-days: 7
          if-no-files-found: error
